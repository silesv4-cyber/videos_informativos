<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Instant Replay</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #000;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
      position: relative;
      font-family: sans-serif;
    }
    video {
      width: 100%;
      height: 100%;
      object-fit: contain;
      background-color: black;
      display: none; /* Hidden until user taps */
    }
    .overlay {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(0,0,0,0.7);
      color: #fff;
      padding: 18px 28px;
      border-radius: 12px;
      font-size: 20px;
      cursor: pointer;
      text-align: center;
      z-index: 10;
      transition: opacity 0.3s ease;
    }
    .overlay.hidden {
      opacity: 0;
      pointer-events: none;
    }
  </style>
</head>
<body>

  <!-- Video with native controls -->
  <video id="myVideo" controls loop playsinline>
    <source src="https://files.catbox.moe/nmzwu9.mp4" type="video/mp4" />
    Your browser does not support the video tag.
  </video>

  <!-- Overlay for play -->
  <div id="overlayBtn" class="overlay">▶️ Toca Para Escuchar</div>

  <script>
    const video = document.getElementById('myVideo');
    const overlay = document.getElementById('overlayBtn');

    overlay.addEventListener('click', () => {
      video.style.display = 'block'; // Show video
      video.play(); // Start playback
      overlay.classList.add('hidden'); // Hide overlay
    });

    // Optional: allow replay when video ends
    video.addEventListener('ended', () => {
      overlay.textContent = '🔁 Replay';
      overlay.classList.remove('hidden');
      video.style.display = 'none';
    });
  </script>

</body>
</html>
